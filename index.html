*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;background:#f0c188;}

#againBtn{margin-top:1rem;appearance:none;border:0;border-radius:999px;background:#3c2410;color:#fdf3e3;font-family:'DM Sans',sans-serif;font-weight:500;font-size:.98rem;padding:.7rem 1.9rem;cursor:pointer;}
