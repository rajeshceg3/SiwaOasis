<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Siwa</title>
<meta name="description" content="A quiet journey through the Siwa Oasis - palms, salt lakes, the Shali, and the Great Sand Sea.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%23d9a45b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="oasis" aria-label="A living scene of the Siwa Oasis. Drag slowly to drift."></canvas>

<div id="veil" aria-hidden="true">
  <h1 class="wordmark">Siwa</h1>
</div>

<header id="masthead" class="chrome" aria-hidden="true">
  <span class="wordmark-small">Siwa</span>
</header>

<p id="caption" class="chrome" role="status"></p>
<p id="whisper" class="chrome"></p>

<nav id="dock" class="chrome" aria-label="Places of the oasis">
  <button class="dot" data-scene="0" aria-label="The date-palm sea"><i></i><span>Palms</span></button>
  <button class="dot" data-scene="1" aria-label="The salt lakes"><i></i><span>Salt</span></button>
  <button class="dot" data-scene="2" aria-label="The Shali fortress"><i></i><span>Shali</span></button>
  <button class="dot" data-scene="3" aria-label="The Great Sand Sea at night"><i></i><span>Night</span></button>
</nav>

<script type="module" src="src/main.js"></script>
</body>
</html>
