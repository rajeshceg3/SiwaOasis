<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Siwa</title>
<meta name="description" content="A quiet journey through the Siwa Oasis - palms, salt lakes, the Shali, and the Great Sand Sea.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%23d9a45b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<link rel="preload" href="fonts/caveat-brush.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="oasis" aria-label="A living scene of the Siwa Oasis. Drag slowly to drift."></canvas>

<div id="veil" aria-hidden="true">
  <h1 class="wordmark">Siwa</h1>
</div>

<button id="hint" class="hint" type="button" aria-label="Show controls">
  <svg class="ink-icon" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3.5 L18.6 13.2 L28.4 16 L18.4 18.7 L16.2 28.6 L13.4 18.6 L3.6 16.3 L13.5 13.4 Z"/><circle cx="16" cy="16" r="1.6"/></svg>
</button>

<header id="masthead" class="chrome" aria-hidden="false">
  <span class="wordmark-small">Siwa</span>
  <button id="sound" type="button" class="ink-toggle" aria-pressed="false" title="Quiet synthesized environmental sound, not field recordings">Sound on</button>
  <button id="pin-controls" class="ink-toggle" type="button" aria-pressed="false" aria-label="Keep controls visible" title="Keep controls visible">
    <svg class="ink-icon" viewBox="0 0 32 32" aria-hidden="true"><path d="M9.6 4.4 L22.4 5 L20.6 12.6 L17.6 14.4 L17 22.6 L16 29 L15 22.6 L14.4 14.4 L11.4 12.6 Z"/></svg>
  </button>
</header>

<p id="caption" role="status"></p>
<p id="whisper" class="chrome"></p>

<nav id="dock" class="chrome" aria-label="Places of the oasis">
  <svg class="route" viewBox="0 0 300 24" preserveAspectRatio="none" aria-hidden="true"><path d="M4 13 C36 4 58 21 98 12 S158 5 200 13 S262 20 296 10"/></svg>
  <button class="dot" data-scene="0" aria-label="The date-palm sea"><b><svg class="ink-icon" viewBox="0 0 32 32" aria-hidden="true"><path d="M16.5 28.5 C15.4 22.5 16.2 17 17.4 12.2"/><path d="M17.4 12.2 C13.4 8.2 9 8.8 5.8 12.4"/><path d="M17.4 12.2 C16.2 7.4 19.4 4.2 23.4 5.2"/><path d="M17.4 12.2 C21.4 9.2 25.6 10.2 27.4 14.4"/><path d="M17.4 12.2 C14 12 11 14.2 9.8 17.6"/></svg></b><span>Palms</span></button>
  <button class="dot" data-scene="1" aria-label="The salt lakes"><b><svg class="ink-icon" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4.6 L20.4 10.2 L16.2 16 L11.6 10.6 Z"/><path d="M3.8 21.4 C9 18 12.2 24.4 17 21 C21.2 18 24.4 23.4 28.2 20.2"/><path d="M6.8 26.6 C11 24 14.4 28.4 18.2 25.8 C21.4 24 24 27 26.4 25.2"/></svg></b><span>Salt</span></button>
  <button class="dot" data-scene="2" aria-label="The Shali fortress"><b><svg class="ink-icon" viewBox="0 0 32 32" aria-hidden="true"><path d="M5 28.4 L5.4 17 L9.2 17.2 L9 12 L13 12.2 L13.2 8 L19 7.8 L19.2 12.2 L23 12 L23.2 17 L27 17.2 L27.2 28.4 Z"/><path d="M14 28.4 L14.2 21.6 Q16.2 19 18.2 21.4 L18 28.4"/></svg></b><span>Shali</span></button>
  <button class="dot" data-scene="3" aria-label="The Great Sand Sea at night"><b><svg class="ink-icon" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3.6 L18.6 13.2 L28.4 16 L18.4 18.8 L16.2 28.6 L13.4 18.6 L3.6 16.3 L13.5 13.4 Z"/></svg></b><span>Night</span></button>
</nav>

<script type="module" src="src/main.js"></script>
</body>
</html>
